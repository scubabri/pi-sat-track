# Build versioned self-extracting installer and upload to S3.
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# Optional secrets (omit entirely if unused — do not create them empty):
#   AWS_REGION   (default us-east-1)
#   S3_BUCKET    (default pi-sat-track)
#   S3_PREFIX    (default empty = bucket root)
#
# Single S3 object per build:
#   pi-sat-track-<branch>-alpha.<N>.run
# Version file on Pi: <branch>-alpha.<N>

name: Build SFX installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Alpha version number (blank = use run number)"
        required: false
        default: ""
      upload:
        description: "Upload to S3"
        type: boolean
        default: true
  push:
    branches:
      - CAT
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: build-sfx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and branch
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${{ github.run_number }}"
          fi
          V="$(echo "$V" | tr -cd '0-9.')"
          [[ -n "$V" ]] || V="${{ github.run_number }}"

          B="${GITHUB_REF_NAME:-}"
          if [[ -z "$B" ]]; then
            B="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
          fi
          B="$(echo "$B" | sed 's#refs/heads/##' | tr -c 'A-Za-z0-9._-' '-' | sed 's/--*/-/g;s/^-//;s/-$//')"
          [[ -n "$B" ]] || B="unknown"

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "branch=$B" >> "$GITHUB_OUTPUT"
          echo "label=${B}-alpha.${V}" >> "$GITHUB_OUTPUT"
          echo "run_file=pi-sat-track-${B}-alpha.${V}.run" >> "$GITHUB_OUTPUT"
          echo "Resolved: branch=$B version=$V label=${B}-alpha.${V}"

      - name: Make build script executable
        run: chmod +x build-sfx.sh

      - name: Build self-extracting installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ steps.ver.outputs.branch }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          mkdir -p "$OUT_DIR"
          ./build-sfx.sh "${{ github.workspace }}"
          ls -la "$OUT_DIR"
          echo "VERSION file:"
          cat VERSION
          cat dist/build-sfx.meta || true

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: pi-sat-track-${{ steps.ver.outputs.branch }}-alpha-${{ steps.ver.outputs.version }}
          path: |
            dist/pi-sat-track-${{ steps.ver.outputs.branch }}-alpha.${{ steps.ver.outputs.version }}.run
            dist/build-sfx.meta
          if-no-files-found: error
          retention-days: 30

      - name: Resolve AWS settings
        if: ${{ github.event_name == 'push' || github.event.inputs.upload == 'true' }}
        id: aws
        env:
          SECRET_REGION: ${{ secrets.AWS_REGION }}
          SECRET_BUCKET: ${{ secrets.S3_BUCKET }}
          SECRET_PREFIX: ${{ secrets.S3_PREFIX }}
        run: |
          REGION="${SECRET_REGION:-}"
          BUCKET="${SECRET_BUCKET:-}"
          PREFIX="${SECRET_PREFIX:-}"
          REGION="$(echo -n "$REGION" | tr -d '[:space:]')"
          BUCKET="$(echo -n "$BUCKET" | tr -d '[:space:]')"
          [[ -n "$REGION" ]] || REGION="us-east-1"
          [[ -n "$BUCKET" ]] || BUCKET="pi-sat-track"
          PREFIX="${PREFIX#/}"
          PREFIX="$(echo -n "$PREFIX" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ -n "$PREFIX" && "$PREFIX" != */ ]]; then
            PREFIX="${PREFIX}/"
          fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "Using region=$REGION bucket=$BUCKET prefix='${PREFIX}'"

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' || github.event.inputs.upload == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.aws.outputs.region }}

      - name: Upload to S3
        if: ${{ github.event_name == 'push' || github.event.inputs.upload == 'true' }}
        env:
          VER: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ steps.ver.outputs.branch }}
          RUN_FILE: ${{ steps.ver.outputs.run_file }}
          RESOLVED_REGION: ${{ steps.aws.outputs.region }}
          RESOLVED_BUCKET: ${{ steps.aws.outputs.bucket }}
          RESOLVED_PREFIX: ${{ steps.aws.outputs.prefix }}
        run: |
          set -euo pipefail

          unset AWS_REGION || true
          export AWS_DEFAULT_REGION="${RESOLVED_REGION:-us-east-1}"
          export AWS_REGION="${RESOLVED_REGION:-us-east-1}"

          REGION="${AWS_REGION}"
          BUCKET="${RESOLVED_BUCKET:-pi-sat-track}"
          PREFIX="${RESOLVED_PREFIX:-}"

          echo "AWS_REGION=${AWS_REGION}"
          if [[ -z "$REGION" ]]; then
            echo "ERROR: region still empty after resolve" >&2
            exit 1
          fi

          SRC_VER="dist/${RUN_FILE}"
          DEST_VER="s3://${BUCKET}/${PREFIX}${RUN_FILE}"

          echo "Upload: ${SRC_VER} → ${DEST_VER}"
          aws s3 cp "${SRC_VER}" "${DEST_VER}" \
            --region "${REGION}" \
            --content-type application/octet-stream

          echo "S3 listing:"
          aws s3 ls "s3://${BUCKET}/${PREFIX}" --region "${REGION}" \
            | grep -E 'pi-sat-track' || true
