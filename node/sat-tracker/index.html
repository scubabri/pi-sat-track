<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Sat Track – Blue Marble</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.65) !important;
      color: #ccc !important;
      font-size: 11px;
    }
    .leaflet-control-attribution a { color: #8cf !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 1,
      maxZoom: 8,
      worldCopyJump: true
    });

    // Primary: NASA GIBS Blue Marble (Shaded Relief + Bathymetry)
    const blueMarble = L.tileLayer(
      'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/' +
      'BlueMarble_ShadedRelief_Bathymetry/default/' +
      'GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg',
      {
        attribution: 'Imagery © <a href="https://earthdata.nasa.gov/gibs">NASA GIBS</a> / Blue Marble',
        maxZoom: 8,
        tileSize: 256,
        errorTileUrl: ''   // prevents broken-image icons
      }
    );

    // Reliable fallback (looks very similar)
    const esriWorld = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles © Esri',
        maxZoom: 19
      }
    );

    // Try Blue Marble first; fall back if tiles fail
    blueMarble.addTo(map);

    blueMarble.on('tileerror', function() {
      // Once we get an error we switch to the reliable layer
      if (map.hasLayer(blueMarble)) {
        map.removeLayer(blueMarble);
        esriWorld.addTo(map);
        console.log('Switched to Esri World Imagery fallback');
      }
    });
  </script>
</body>
</html>
